<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fieldnote — Markdown Viewer</title>
    <meta name="description" content="Upload a markdown file and read it rendered cleanly, with one-click rich copy to Word, Docs, or Slack." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-paper text-ink antialiased dark:bg-[#0e0f13] dark:text-zinc-100">
    <script>
      // Apply theme before first paint to avoid a flash.
      (function () {
        try {
          var saved = localStorage.getItem('fieldnote-theme');
          var dark =
            saved === 'dark' ||
            (!saved &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
